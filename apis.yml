name: Supafax
description: >-
  Supafax is an AI email assistant and autonomous inbox agent from Veriad, Inc.
  (Y Combinator Winter 2026) that lives inside Gmail and Outlook to proactively
  manage email and calendar. It drafts context-aware replies in your writing
  style, auto-labels and prioritizes messages, schedules and books meetings
  through back-and-forth coordination, answers inbox queries, and runs custom
  automation rules defined in plain English. Founded in 2025 in San Francisco by
  Rohan Mahendraker and Anton Muratov, Supafax sells a Professional plan and an
  Enterprise tier with SSO/SCIM, custom integrations, and dedicated support. It
  is a consumer/B2B productivity product with no public developer API at this
  time; its security posture (security.txt, CASA Tier 2, ICO registration, GDPR)
  is its most developer-relevant public surface.
